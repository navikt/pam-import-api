spec:
  ingresses:
    - https://arbeidsplassen-api.nav.no/stillingsimport
    - https://pam-import-api.intern.nav.no/stillingsimport
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - name: import-api-stilling
        type: POSTGRES_18
        tier: db-custom-2-7680
        diskType: SSD
        highAvailability: true
        diskSize: 20
        diskAutoresize: true
        databases:
          - name: importapi
            envVarPrefix: DB
        cascadingDelete: false
  env:
    - name: AD_PREVIEW_URL
      value: https://arbeidsplassen.nav.no/stillinger/stilling
