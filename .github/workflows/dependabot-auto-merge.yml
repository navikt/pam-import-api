name: dependabot-auto-merge
on:
  workflow_run:
    workflows: [main]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/docker/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --head "$HEAD_BRANCH" --author 'app/dependabot' --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR for $HEAD_BRANCH"
            exit 0
          fi
          gh pr merge "$pr" --squash --match-head-commit "$HEAD_SHA"
